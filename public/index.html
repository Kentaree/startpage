<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pete's start page</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
  <script src="signout.js" defer></script>
</head>
<body>
  <h1>Pete's start page</h1>
  <div class="toolbar">
    <button type="button" data-add="clock" class="app-btn">Add clock</button>
    <button type="button" data-add="weather" class="app-btn">Add weather</button>
    <button type="button" data-add="rss" class="app-btn">Add RSS</button>
    <button type="button" id="signout" class="app-btn">Sign out</button>
  </div>
  <p id="app-error" class="app-error" role="alert" hidden></p>
  <main id="grid" class="grid"></main>
</body>
</html>
